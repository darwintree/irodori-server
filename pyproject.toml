[project]
name = "irodori-server"
version = "0.1.0"
description = "Genie-compatible CPU TTS inference server powered by Irodori-TTS MeanFlow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.82",
    "dacvae",
    "fastapi>=0.111.0",
    "huggingface-hub>=0.34.0",
    "irodori-tts",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "safetensors>=0.7.0",
    "sentencepiece>=0.1.99,<0.2",
    "slowapi>=0.1.10",
    "soundfile>=0.12.0",
    "transformers>=5.12.1,<6",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.10.0,<2.11.0",
    "torchaudio>=2.10.0,<2.11.0",
    "torchcodec>=0.10.0,<0.11.0",
]
cu128 = [
    "torch>=2.10.0,<2.11.0",
    "torchaudio>=2.10.0,<2.11.0",
    "torchcodec>=0.10.0,<0.11.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
irodori-tts = { git = "https://github.com/Aratako/Irodori-TTS.git", rev = "f01c08c" }
dacvae = { git = "https://github.com/facebookresearch/dacvae" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
